# Plain MQTT for the relay and for the proxy that terminates TLS in front; published on loopback only.
listener 1883
allow_anonymous false

# Logins and ACLs come from the dynamic-security plugin: one admin client `relay`, which adds a
# client and role per pager over $CONTROL/dynamic-security/v1. The broker rewrites the file.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# QoS 1 queues for a sleeping pager survive a broker restart.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
