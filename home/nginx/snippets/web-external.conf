# TLS_MODE=external: a public certificate kept current by something outside this stack
# (PAGER_CERT_DIR). Variables make nginx read the files per handshake, so a renewal needs no reload
# and nginx starts before the files exist.
ssl_certificate $pager_ext_fullchain;
ssl_certificate_key $pager_ext_privkey;
add_header Strict-Transport-Security "max-age=31536000" always;
