# TLS_MODE=external. 8884 is for Soracom Beam, which validates against public roots: it serves the
# certificate from PAGER_CERT_DIR and proxies to the same broker as 8883.
map $ssl_server_name $pager_beam_fullchain {
    default /data/certs/external/fullchain.pem;
}
map $ssl_server_name $pager_beam_privkey {
    default /data/certs/external/privkey.pem;
}

server {
    listen 8884 ssl;
    listen [::]:8884 ssl;
    ssl_certificate $pager_beam_fullchain;
    ssl_certificate_key $pager_beam_privkey;
    include /etc/nginx/snippets/tls.conf;

    proxy_timeout 1h;
    proxy_pass $mqtt_upstream;
}
