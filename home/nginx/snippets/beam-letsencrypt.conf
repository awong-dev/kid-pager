# TLS_MODE=letsencrypt. 8884 is for Soracom Beam, which validates against public roots: it serves the
# Let's Encrypt certificate and proxies to the same broker as 8883. Variables make nginx load the
# files per handshake, so nginx starts before the first certificate exists.
map $ssl_server_name $pager_beam_fullchain {
    default /data/certs/letsencrypt/live/pager/fullchain.pem;
}
map $ssl_server_name $pager_beam_privkey {
    default /data/certs/letsencrypt/live/pager/privkey.pem;
}

server {
    listen 8884 ssl;
    listen [::]:8884 ssl;
    ssl_certificate $pager_beam_fullchain;
    ssl_certificate_key $pager_beam_privkey;
    include /etc/nginx/snippets/tls.conf;

    proxy_timeout 1h;
    proxy_pass $mqtt_upstream;
}
