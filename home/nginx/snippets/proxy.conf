# Forwarding headers are overwritten, never appended: the relay rate-limits by the first
# X-Forwarded-For hop, so a client-supplied value must not survive.
set $relay_upstream http://relay:8000;
# $pager_uri: the client's request line minus PAGER_PATH (templates/pager.conf.template).
proxy_pass $relay_upstream$pager_uri;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
