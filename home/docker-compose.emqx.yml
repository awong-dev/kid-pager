# EMQX instead of Mosquitto, with the relay in BROKER_MODE=rest. Mosquitto is not started.
#   docker compose -f docker-compose.yml -f docker-compose.emqx.yml up -d
# The dashboard/REST API is published on 127.0.0.1:18083 only; EMQX state is in the `emqx-data` volume.

x-relay-image: &relay-image
  image: pager-relay-home:local
  build:
    context: ../relay
    additional_contexts:
      web: ../web
    args:
      WEB: ${PAGER_WEB:-home}

services:
  emqx:
    image: emqx/emqx:5.8.0
    entrypoint:
      - /bin/sh
      - -c
      - set -a && . /pager/emqx.env && set +a && exec /usr/bin/docker-entrypoint.sh "$$@"
      - --
    command: ["/opt/emqx/bin/emqx", "foreground"]
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      EMQX_API_KEY__BOOTSTRAP_FILE: /pager/bootstrap_api_keys.txt
    ports:
      - "127.0.0.1:18083:18083"
    volumes:
      - ../relay/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ${PAGER_DATA_DIR:-./data}/emqx:/pager:ro
      - emqx-data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Applies the rule engine over EMQX's API on every `up` (tools/emqx_setup.py, idempotent).
  emqx-setup:
    <<: *relay-image
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set -a && . /data/secrets.env && set +a &&
        exec python /opt/emqx_setup.py --emqx-url http://emqx:18083
        --relay-url http://relay:8000 --webhook-key "$$WEBHOOK_KEY"
        --admin-password "$$BROKER_ADMIN_PASSWORD"
        --relay-mqtt-password "$$BROKER_ADMIN_PASSWORD"
    depends_on:
      emqx:
        condition: service_healthy
    volumes:
      - ../tools/emqx_setup.py:/opt/emqx_setup.py:ro
      - ${PAGER_DATA_DIR:-./data}:/data:ro
    restart: "no"

  relay:
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      BROKER_MODE: rest
      BROKER_API_URL: http://emqx:18083/api/v5

  nginx:
    depends_on:
      emqx:
        condition: service_started
    environment:
      MQTT_UPSTREAM: emqx:1883

  # Only under an explicit `--profile mosquitto`: EMQX is the broker here.
  mosquitto:
    profiles: [mosquitto]

volumes:
  emqx-data:
