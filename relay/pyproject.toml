[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    # Firestore and Firebase Auth (bundles google-cloud-firestore); emulator-aware via
    # FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST.
    "firebase-admin",
    # Google JWT verification and ADC for the Chat API (`app/backends/gchat.py`).
    "google-auth",
    # `app/tasks.py` CloudTasksQueue (TASKS_MODE=cloud_tasks).
    "google-cloud-tasks",
    # Integer-keyed CBOR wire encoding (docs/PROTOCOL.md §10, `app/wirecbor.py`).
    "cbor2",
    # Bootstrap-bundle crypto in `app/devsetup.py`: HKDF-SHA256 and AES-256-GCM.
    "cryptography",
    # Parses typed SMS contact numbers with a default region ("US").
    "phonenumbers",
    # `app/firmware.py` builds OTA deltas on demand and writes them to the firmware bucket.
    "detools",
    "google-cloud-storage",
    # `app/authn_home.py`: argon2id password hashes and WebAuthn passkeys.
    "argon2-cffi",
    "webauthn",
    # Web Push (VAPID) in `app/push_webpush.py`; bundles py_vapid, used by `app/homeinit.py`.
    "pywebpush",
    # Persistent MQTT client under BROKER_MODE=mqtt (`app/broker_mqtt.py`), tools/pager_client.py.
    "paho-mqtt>=2",
]

[project.scripts]
# `docker compose run relay pager-admin reset-password <alias>`.
pager-admin = "app.homeadmin:main"

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Tests import shared fixtures from tests/bridge_world.py; pytest needs them in the module scope.
"tests/test_bridge*.py" = ["F811"]
"tests/test_chat*.py" = ["F811"]
"tests/test_family_bridges.py" = ["F811"]
"tests/test_whatsapp.py" = ["F811"]
"tests/test_webpush.py" = ["F811"]

# Tests import the shared fixtures from tests/bridge_world.py; pytest needs them in the module
# namespace.