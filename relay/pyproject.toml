[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    # Firestore and Firebase Auth (bundles google-cloud-firestore); emulator-aware via
    # FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST.
    "firebase-admin",
    # Google JWT verification and ADC for the Chat API (`app/backends/gchat.py`).
    "google-auth",
    # `app/tasks.py` CloudTasksQueue (TASKS_MODE=cloud_tasks).
    "google-cloud-tasks",
    # Integer-keyed CBOR wire encoding (docs/PROTOCOL.md §10, `app/wirecbor.py`).
    "cbor2",
    # Bootstrap-bundle crypto in `app/devsetup.py`: HKDF-SHA256 and AES-256-GCM.
    "cryptography",
    # Parses typed SMS contact numbers with a default region ("US").
    "phonenumbers",
]

[project.optional-dependencies]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Tests import shared fixtures from tests/bridge_world.py; pytest needs them in the module scope.
"tests/test_bridge*.py" = ["F811"]
"tests/test_chat*.py" = ["F811"]
"tests/test_family_bridges.py" = ["F811"]
