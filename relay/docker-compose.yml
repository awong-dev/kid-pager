# For local development only — do not use in production

version: "3.8"

services:
  # EMQX OSS, pinned to 5.8.0 (the "5" tag has no manifest).
  emqx:
    image: emqx/emqx:5.8.0
    ports:
      - "1883:1883" # MQTT, for the device (real or simulated)
      - "18083:18083" # dashboard/management REST API (setup script + relay's REST publish)
    volumes:
      # Pre-seeds an api_key:api_secret pair matching BROKER_API_KEY/BROKER_API_SECRET in .env.
      - ./emqx/bootstrap_api_keys.txt:/opt/emqx/data/bootstrap_api_keys.txt:ro
      # Built-in database authentication + authorization, deny-by-default (see emqx.conf).
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
    environment:
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/data/bootstrap_api_keys.txt
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - pager-net

  relay:
    build: .
    depends_on:
      emqx:
        condition: service_healthy
      firebase:
        condition: service_healthy
    environment:
      # Emulator-aware settings pointing at the `firebase` service; they override .env values.
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
      GOOGLE_CLOUD_PROJECT: demo-pager
      DEV_MODE: "1"
      # Raised rate limits for tools/e2e_v2.py's many admin writes; test-only, never for deployment.
      RATE_LIMIT_BACKEND_CREATE_LIMIT: "1000"
      RATE_LIMIT_ADMIN_WRITE_LIMIT: "1000"
      RATE_LIMIT_WEBHOOK_IP_LIMIT: "1000"
    ports:
      - "8000:8000"
    networks:
      - pager-net

  # Firestore and Auth run as local emulators (relay/emulator.Dockerfile).
  firebase:
    build:
      context: .
      dockerfile: emulator.Dockerfile
    ports:
      - "8080:8080" # Firestore emulator
      - "9099:9099" # Auth emulator
      - "4000:4000" # Emulator Suite UI
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/', r => process.exit(0)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - pager-net

networks:
  pager-net:
    driver: bridge
